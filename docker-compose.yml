services:
    client:
        build: ./client
        container_name: client
        ports:
            - '3000:80'
        depends_on:
            - server

    server:
        build: ./server
        container_name: server
        environment:
            - PINECONE_API_KEY=${PINECONE_API_KEY}
            - GROQ_API_KEY=${GROQ_API_KEY}
            - HF_EMBEDDING_MODEL=${HF_EMBEDDING_MODEL}
            - GROQ_MODEL=${GROQ_MODEL}
            - MAX_TOKENS=${MAX_TOKENS}
            - INDEX_NAME=${INDEX_NAME}
            - SECRET_KEY=${SECRET_KEY}
            - CORS_ORIGINS=${CORS_ORIGINS}
            - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
            - SUAP_CLIENT_ID=${SUAP_CLIENT_ID}
            - SUAP_CLIENT_SECRET=${SUAP_CLIENT_SECRET}
            - SUAP_REDIRECT_URI=${SUAP_REDIRECT_URI}
            - SUAP_AUTHORIZATION_URL=${SUAP_AUTHORIZATION_URL}
            - SUAP_TOKEN_URL=${SUAP_TOKEN_URL}
            - SUAP_PROFILE_URL=${SUAP_PROFILE_URL}
            - SUAP_PROFILE_FALLBACK_URL=${SUAP_PROFILE_FALLBACK_URL}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_NAME=${DB_NAME}
            - TRASH_RETENTION_DAYS=${TRASH_RETENTION_DAYS}
        depends_on:
            - database

    database:
        image: mysql:8
        container_name: database
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: db_eduia
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    db_data:
